<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privora - Coming Soon</title>
    <style>
      
        @font-face {
            font-family: 'Goldplay';
            src: url('assets/fonts/GoldplayAlt-Regular.otf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

      
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d12; 
            color: #ffffff;
            font-family: 'Goldplay', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

       
        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 140px; 
            height: auto;
            display: block;
        }

      
        .brand-name {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #b36bf5;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

      
        .coming-soon {
            font-size: 1.2rem;
            color: #a0a0a0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- آدرس لوگو از پوشه assets -->
        <img src="assets/privoralogo.png" alt="Privora Logo">
    </div>

    <h1 class="brand-name">Privora</h1>
    
    <p class="coming-soon">coming soon..</p>

</body>
</html>
